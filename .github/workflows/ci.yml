name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/test_pipeline.py telemetry_feed/test_speed_profile.py

  rust:
    name: Rust sidecar check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check pit timer
        working-directory: pit_timer_backend
        run: cargo check

  native:
    name: C++ native scorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native scorer
        run: |
          cmake -S cpp/pip_race_native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native
