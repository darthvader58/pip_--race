services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
    profiles: ["pipeline"]

  pit-timer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BIND_ADDR: 0.0.0.0:8765
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8765:8765"
    depends_on:
      - redis

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - pit-timer
